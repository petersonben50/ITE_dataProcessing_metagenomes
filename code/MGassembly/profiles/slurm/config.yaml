# profiles/slurm/config.yaml

# Set up the working directory paths
#containers_location: "/tank/data/LS/petersob/containers/"
#plbs_location: "/tank/data/LS/petersob/Peterson_Lab_Bioinformatics_Scaffold"

# Maximum number of jobs to submit concurrently to the cluster.
jobs: 12

# Settings for slurm snakemake plugin catalog
executor: slurm
# Query job status via squeue (talks to slurmctld) rather than sacct, which
# needs the slurmdbd accounting database and is unreachable from compute
# nodes on this cluster. Requires MinJobAge (300 s here) to exceed the
# plugin's polling interval so finished jobs remain visible.
slurm-status-command: squeue
default-resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 4
  mem: 32G
  slurm_partition: batch
  runtime: 480
set-resources:
  fastp_qc_trim:
    cpus_per_task: 8
    mem: 32G
    slurm_partition: batch
    runtime: 480
  run_metaspades_assembly:
    cpus_per_task: 22
    mem: 240G
    slurm_partition: 256g
    runtime: 28800

# Enable Apptainer container usage for rules that specify a 'container:' directive.
use-apptainer: true

# Set up the binding for the PLBS.
# NOTE: run_workflow.sh overrides this on the command line to also bind the
# workshop directory (processed_data_root) at its absolute host path. This
# default is only used if snakemake is invoked directly with this profile.
apptainer-args: "--bind /tank/data/LS/petersob/Peterson_Lab_Bioinformatics_Scaffold:/opt/plbs"