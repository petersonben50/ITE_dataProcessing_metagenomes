#==============================================================================#
#                       Snakemake Configuration (config.yaml)                  #
#==============================================================================#

#==============================================================================#
#                                    Global                                    #
#==============================================================================#

# --- Sample Definitions ---
# List of metagenome IDs to process.
metagenomes:
  - "ASBP005A"
  - "ASBP005B"
  - "ASBP005C"
  - "ASBP005D"
  - "ASBP005E"

# Directory for raw sequencing reads
raw_reads_dir: "/tank/data/LS/petersob/metagenomes/ITE"

# Base directory where all processed data will be stored.
# Relative paths are interpreted from the workflow directory (code/MGassembly).
processed_data_root: "/tank/data/LS/petersob/petersob/ITE/ITE_dataProcessing_metagenomes/data/MGassembly_workshop"
# Base directory where all final data will be stored
final_data_root: "/tank/data/LS/petersob/petersob/ITE/MGassembly_final"


# Apptainer container names
fastp_container: "/tank/data/LS/petersob/containers/fastp.sif"
spades_container: "/tank/data/LS/petersob/containers/metaSPADes.sif"

# Wrapper scripts. Relative to PLBS.
plbs_location: "/tank/data/LS/petersob/Peterson_Lab_Bioinformatics_Scaffold"
fastp_wrapper_script_name: "executables/filterReads_for_MGassembly_by_fastp.sh"
spades_wrapper_script_name: "executables/MGassembly/assembleReads_by_metaspades.py"

#==============================================================================#
#                           MG assembly by metaSPADes                          #
#==============================================================================#


# SPADes settings
spades_kmers: "21,33,55,77,99,127"
