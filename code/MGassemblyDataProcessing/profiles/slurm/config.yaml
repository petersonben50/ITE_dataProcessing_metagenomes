# profiles/slurm/config.yaml

# Set up the working directory paths
#containers_location: "/tank/data/LS/petersob/containers/"
#plbs_location: "/tank/data/LS/petersob/Peterson_Lab_Bioinformatics_Scaffold"

# Maximum number of jobs to submit concurrently to the cluster.
jobs: 12

# Settings for slurm snakemake plugin catalog
executor: slurm
default-resources:
  nodes: 1
  tasks: 1
  cpus_per_task: 4
  mem: 32G
  slurm_partition: batch
  runtime: 480
set-resources:
  fastp_qc_trim:
    cpus_per_task: 8
    mem: 32G
    slurm_partition: batch
    runtime: 480

# Enable Apptainer container usage for rules that specify a 'container:' directive.
use-apptainer: true

# Set up the binding for the PLBS
apptainer-args: "--bind /tank/data/LS/petersob/Peterson_Lab_Bioinformatics_Scaffold:/opt/plbs --bind /tank/data/LS/petersob/petersob/dataProcessing_GLWCHg_LE_PRE_MG/data/MGassemblyDataProcessing_workshop:/tank/data/LS/petersob/petersob/dataProcessing_GLWCHg_LE_PRE_MG/data/MGassemblyDataProcessing_workshop:rw"